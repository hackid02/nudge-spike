# Second test layer: fast, deterministic unit checks for the money maths
# (half-up rounding, tax, formatting). Runs on every PR and push to main.
# It does not call TestSprite, so it costs no credits.
name: unit-tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  money:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
